name: Build YUMY Intruder Selfie APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/build-apk.yml' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/YUMY_Intruder_Selfie_v1.0.2_debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YUMY_Intruder_Selfie_v1.0.2_debug
          path: dist/YUMY_Intruder_Selfie_v1.0.2_debug.apk
          if-no-files-found: error
